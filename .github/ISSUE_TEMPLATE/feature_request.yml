name: Feature request
description: Suggest an idea, a new provider or a better prompting rule.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: For prompting rules, link the official guide the change is based on.
