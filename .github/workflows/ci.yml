name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Downloads the Electron binary if it was not fetched; also exercises the install step from the README.
      - run: npm run setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Both products are packaged from the same commit with build/<product>.yml (no installer, only the unpacked package);
      # each one starts without network or keys, loads all knowledge cards, and reports that it launched as the right product.
      - name: Package and smoke both products
        shell: bash
        run: |
          for p in ray spectrum; do
            case "$p" in ray) name="Prism Ray"; exe=prism-ray ;; spectrum) name="Prism Spectrum"; exe=prism-spectrum ;; esac
            rm -rf release
            node scripts/build-product.mjs "$p" --dist dir
            case "$RUNNER_OS" in
              Windows) "release/win-unpacked/$name.exe" --selftest --smoke | tee smoke.log ;;
              macOS) app=$(ls -d release/mac*/"$name.app" | head -n 1); "$app/Contents/MacOS/$name" --selftest --smoke | tee smoke.log ;;
              Linux) xvfb-run -a "release/linux-unpacked/$exe" --no-sandbox --selftest --smoke | tee smoke.log ;;
            esac
            grep -q "\"product\": \"$p\"" smoke.log
          done

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No known vulnerability is accepted in packages shipped with the app, and none of high severity in dev tooling.
      - run: npm audit --omit=dev
      - run: npm audit --audit-level=high

  semgrep:
    name: semgrep (SAST and secrets)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config p/owasp-top-ten --config p/typescript --config p/react --config p/secrets --error --metrics=off --exclude website
