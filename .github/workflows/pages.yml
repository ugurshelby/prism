name: Website

# Builds the site in the website/ folder and publishes it to GitHub Pages. When a new release is published,
# the Release workflow triggers this by hand (releases created with GITHUB_TOKEN do not start other workflows).
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/screenshots/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['website/**', 'docs/screenshots/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      # The token is given only to the step that reads the GitHub release list; the site build and its dependencies never see it.
      - run: npm run sync
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npx astro build
        working-directory: website
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
