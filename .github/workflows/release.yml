name: Release

# Prism Ray bakım dalı: v1.* etiketiyle üç platformda kurulum dosyaları derlenir, paketlenmiş uygulama
# duman testinden geçer ve hepsi tek bir GitHub Release'e yüklenir.
on:
  push:
    tags: ['v1.*']

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: --win
            smoke: '"release/win-unpacked/Prism Ray.exe" --selftest --smoke'
          - os: macos-latest
            dist: --mac
            smoke: '"release/mac-arm64/Prism Ray.app/Contents/MacOS/Prism Ray" --selftest --smoke'
          - os: ubuntu-latest
            dist: --linux
            smoke: xvfb-run -a release/linux-unpacked/prism-ray --no-sandbox --selftest --smoke
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Electron binary
        shell: bash
        run: test -f node_modules/electron/path.txt || node node_modules/electron/install.js
      - run: npm run build
      - run: npx electron-builder ${{ matrix.dist }} --publish never
      - name: Smoke test (packaged app)
        shell: bash
        run: ${{ matrix.smoke }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-ray-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Prism Ray ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --latest=false \
            --verify-tag
      # Sitedeki indirme bağlantıları yeni sürüme geçsin.
      - name: Update website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
