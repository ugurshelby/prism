name: Release

# When a tag like `ray-v2.0.0` or `spectrum-v3.0.0` is pushed, only that product is built on three platforms,
# the packaged app passes a smoke test, and everything is uploaded to a single GitHub Release.
on:
  push:
    tags: ['ray-v*', 'spectrum-v*']

permissions:
  contents: read

# Two tags of the same product are not released at the same time (so the "latest" and draft checks do not race).
concurrency:
  group: release-${{ startsWith(github.ref_name, 'ray-v') && 'ray' || 'spectrum' }}
  cancel-in-progress: false

jobs:
  # Derive the product and version from the tag. The version must match build/<product>.yml in the repo: so the tag and
  # the package version cannot diverge, and a version bump is always visible as a commit.
  meta:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.tag.outputs.product }}
      prefix: ${{ steps.tag.outputs.prefix }}
      name: ${{ steps.tag.outputs.name }}
      exe: ${{ steps.tag.outputs.exe }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Only a commit on main is released: a release cannot be cut from a side branch by tag.
      - name: Tag must be on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point to a commit on main; releases are cut only from main."
            exit 1
          fi
      - id: tag
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ ^(ray|spectrum)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            product="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          else
            echo "::error::Tag format must be ray-vX.Y.Z or spectrum-vX.Y.Z: $tag"
            exit 1
          fi
          declared=$(sed -n 's/^  version: \([0-9.]*\)$/\1/p' "build/$product.yml")
          if [ "$declared" != "$version" ]; then
            echo "::error::Tag version ($version) does not match the build/$product.yml version ($declared)."
            exit 1
          fi
          case "$product" in
            ray) name="Prism Ray"; exe="prism-ray"; prefix="Prism-Ray-" ;;
            spectrum) name="Prism Spectrum"; exe="prism-spectrum"; prefix="Prism-Spectrum-" ;;
          esac
          {
            echo "product=$product"
            echo "version=$version"
            echo "name=$name"
            echo "exe=$exe"
            echo "prefix=$prefix"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: win
          - os: macos-latest
            dist: mac
          - os: ubuntu-latest
            dist: linux
    runs-on: ${{ matrix.os }}
    env:
      PRODUCT: ${{ needs.meta.outputs.product }}
      APP_NAME: ${{ needs.meta.outputs.name }}
      APP_EXE: ${{ needs.meta.outputs.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The release build uses no cache: the install is clean from the lock file every time.
      - run: npm ci
      - run: npm run setup
      # Libraries bundled into the app sit as devDependencies (vite builds them); audit looks at the whole tree.
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The product is built and packaged with build/<product>.yml (identity, icon, version are product-specific).
      - run: node scripts/build-product.mjs "$PRODUCT" --dist ${{ matrix.dist }}
        shell: bash
      - name: Smoke test (packaged app)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) "release/win-unpacked/$APP_NAME.exe" --selftest --smoke | tee smoke.log ;;
            macOS) "release/mac-arm64/$APP_NAME.app/Contents/MacOS/$APP_NAME" --selftest --smoke | tee smoke.log ;;
            Linux) xvfb-run -a "release/linux-unpacked/$APP_EXE" --no-sandbox --selftest --smoke | tee smoke.log ;;
          esac
          grep -q "\"product\": \"$PRODUCT\"" smoke.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-${{ needs.meta.outputs.product }}-${{ runner.os }}
          path: |
            release/${{ needs.meta.outputs.prefix }}*.exe
            release/${{ needs.meta.outputs.prefix }}*.dmg
            release/${{ needs.meta.outputs.prefix }}*.AppImage
            release/${{ needs.meta.outputs.prefix }}*.deb
          if-no-files-found: error

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      # The files of a published release and SHA256SUMS.txt are never changed: the digests held by people who
      # downloaded and verified must stay valid. The release is first created as a draft and opened once the files are verified;
      # a leftover draft is deleted and rebuilt on the next attempt. If a published tag is pushed again, the job
      # stops with a clear message; a fix is released under a new version number.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ needs.meta.outputs.product }}
          APP_NAME: ${{ needs.meta.outputs.name }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          state=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$state" = false ]; then
            echo "::error::$GITHUB_REF_NAME is already published; files are not modified. Use a new version number."
            exit 1
          fi
          if [ "$state" = true ]; then
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi
          # Notes start from the previous release of the same product; the other product's changes do not mix in.
          prev=$(git tag --list "$PRODUCT-v*" --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$APP_NAME $VERSION" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            ${prev:+--notes-start-tag "$prev"} \
            --verify-tag
          expected=$(ls dist | sort)
          uploaded=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort)
          if [ "$expected" != "$uploaded" ]; then
            echo "::error::Files uploaded to the draft do not match what was expected; the release was not published."
            exit 1
          fi
          # The /releases/latest links in the README go to Spectrum; a Ray release does not become "latest". A patch of an old branch
          # (3.0.1, after 3.1.0) does not take "latest" back: only if it is greater than the current newest.
          latest=false
          if [ "$PRODUCT" = spectrum ]; then
            # Empty if there are no releases at all (404); on any other API error the job stops, latest is never guessed.
            if ! current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>err.txt); then
              grep -q 'Not Found' err.txt || { cat err.txt; exit 1; }
              current=""
            fi
            current="${current#spectrum-v}"; current="${current#v}"
            top=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)
            if [ -z "$current" ] || { [ "$top" = "$VERSION" ] && [ "$current" != "$VERSION" ]; }; then latest=true; fi
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
      # Make the download links on the site switch to the new version.
      - name: Update website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
