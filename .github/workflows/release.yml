name: Release

# `ray-v2.0.0` ya da `spectrum-v3.0.0` gibi bir etiket gönderildiğinde yalnızca o ürün üç platformda derlenir,
# paketlenmiş uygulama duman testinden geçer ve hepsi tek bir GitHub Release'e yüklenir.
on:
  push:
    tags: ['ray-v*', 'spectrum-v*']

permissions:
  contents: read

# Aynı ürünün iki etiketi aynı anda yayımlanmaz ("latest" ve taslak denetimi yarışmasın).
concurrency:
  group: release-${{ startsWith(github.ref_name, 'ray-v') && 'ray' || 'spectrum' }}
  cancel-in-progress: false

jobs:
  # Etiketten ürün ve sürüm çıkar. Sürüm depodaki build/<ürün>.yml ile aynı olmalı: etiketle paket sürümü
  # ayrışmasın, sürüm yükseltmesi her zaman bir commit'le görünür olsun.
  meta:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.tag.outputs.product }}
      prefix: ${{ steps.tag.outputs.prefix }}
      name: ${{ steps.tag.outputs.name }}
      exe: ${{ steps.tag.outputs.exe }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Yalnızca main'deki bir commit yayımlanır: yan daldan etiketle sürüm çıkarılamaz.
      - name: Tag must be on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME main'deki bir commit'i göstermiyor; yayın yalnızca main'den çıkar."
            exit 1
          fi
      - id: tag
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ ^(ray|spectrum)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            product="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          else
            echo "::error::Etiket biçimi ray-vX.Y.Z ya da spectrum-vX.Y.Z olmalı: $tag"
            exit 1
          fi
          declared=$(sed -n 's/^  version: \([0-9.]*\)$/\1/p' "build/$product.yml")
          if [ "$declared" != "$version" ]; then
            echo "::error::Etiket sürümü ($version) build/$product.yml sürümüyle ($declared) aynı değil."
            exit 1
          fi
          case "$product" in
            ray) name="Prism Ray"; exe="prism-ray"; prefix="Prism-Ray-" ;;
            spectrum) name="Prism Spectrum"; exe="prism-spectrum"; prefix="Prism-Spectrum-" ;;
          esac
          {
            echo "product=$product"
            echo "version=$version"
            echo "name=$name"
            echo "exe=$exe"
            echo "prefix=$prefix"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: win
          - os: macos-latest
            dist: mac
          - os: ubuntu-latest
            dist: linux
    runs-on: ${{ matrix.os }}
    env:
      PRODUCT: ${{ needs.meta.outputs.product }}
      APP_NAME: ${{ needs.meta.outputs.name }}
      APP_EXE: ${{ needs.meta.outputs.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Yayın derlemesi önbellek kullanmaz: kurulum her seferinde kilit dosyasından temiz yapılır.
      - run: npm ci
      - run: npm run setup
      # Uygulamaya paketlenen kütüphaneler devDependency olarak durur (vite derler); audit bütün ağaca bakar.
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Ürün derlenir ve build/<ürün>.yml ile paketlenir (kimlik, ikon, sürüm ürüne özel).
      - run: node scripts/build-product.mjs "$PRODUCT" --dist ${{ matrix.dist }}
        shell: bash
      - name: Smoke test (packaged app)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) "release/win-unpacked/$APP_NAME.exe" --selftest --smoke | tee smoke.log ;;
            macOS) "release/mac-arm64/$APP_NAME.app/Contents/MacOS/$APP_NAME" --selftest --smoke | tee smoke.log ;;
            Linux) xvfb-run -a "release/linux-unpacked/$APP_EXE" --no-sandbox --selftest --smoke | tee smoke.log ;;
          esac
          grep -q "\"product\": \"$PRODUCT\"" smoke.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prism-${{ needs.meta.outputs.product }}-${{ runner.os }}
          path: |
            release/${{ needs.meta.outputs.prefix }}*.exe
            release/${{ needs.meta.outputs.prefix }}*.dmg
            release/${{ needs.meta.outputs.prefix }}*.AppImage
            release/${{ needs.meta.outputs.prefix }}*.deb
          if-no-files-found: error

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      # Yayımlanmış bir sürümün dosyaları ve SHA256SUMS.txt hiçbir zaman değiştirilmez: indirip doğrulamış
      # kişilerin elindeki özetler geçerli kalmalı. Yayın önce taslak olarak oluşur, dosyalar doğrulanınca açılır;
      # yarım kalan taslak bir sonraki denemede silinip yeniden kurulur. Yayımlanmış etiket yeniden gönderilirse iş
      # açık bir mesajla durur; düzeltme yeni bir sürüm numarasıyla yayımlanır.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ needs.meta.outputs.product }}
          APP_NAME: ${{ needs.meta.outputs.name }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          state=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$state" = false ]; then
            echo "::error::$GITHUB_REF_NAME zaten yayımlanmış; dosyalar değiştirilmez. Yeni bir sürüm numarası kullan."
            exit 1
          fi
          if [ "$state" = true ]; then
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi
          # Notlar aynı ürünün önceki sürümünden başlar; diğer ürünün değişiklikleri karışmaz.
          prev=$(git tag --list "$PRODUCT-v*" --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$APP_NAME $VERSION" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            ${prev:+--notes-start-tag "$prev"} \
            --verify-tag
          expected=$(ls dist | sort)
          uploaded=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort)
          if [ "$expected" != "$uploaded" ]; then
            echo "::error::Taslağa yüklenen dosyalar beklenenle aynı değil; yayın açılmadı."
            exit 1
          fi
          # README'deki /releases/latest bağlantıları Spectrum'a gider; Ray yayını "latest" olmaz. Eski bir dalın yama
          # sürümü (3.0.1, 3.1.0'dan sonra) "latest"ı geri almaz: yalnızca mevcut en yeniden büyükse.
          latest=false
          if [ "$PRODUCT" = spectrum ]; then
            # Hiç yayın yoksa (404) boş; başka bir API hatasında iş durur, latest tahminle verilmez.
            if ! current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>err.txt); then
              grep -q 'Not Found' err.txt || { cat err.txt; exit 1; }
              current=""
            fi
            current="${current#spectrum-v}"; current="${current#v}"
            top=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)
            if [ -z "$current" ] || { [ "$top" = "$VERSION" ] && [ "$current" != "$VERSION" ]; }; then latest=true; fi
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
      # Sitedeki indirme bağlantıları yeni sürüme geçsin.
      - name: Update website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
