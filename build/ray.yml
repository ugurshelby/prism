# Prism Ray ürün yapılandırması: ortak tabanı (electron-builder.yml) genişletir, yalnızca kimliği ve çıktı adlarını değiştirir.
extends: electron-builder.yml
appId: com.prism.ray
productName: Prism Ray
extraMetadata:
  # deb paket adı package.json name'den gelir; ürünler yan yana kurulabilsin diye ayrı ad.
  name: prism-ray
  version: 2.0.0
artifactName: Prism-Ray-${version}-${os}-${arch}.${ext}
icon: resources/ray/icon.png
# Diziler tabanla birleşir; bu yüzden extraResources yalnızca burada (tabanda yok). Tray dosyaları ürün klasöründen.
extraResources:
  - from: knowledge
    to: knowledge
  - from: resources/ray
    to: .
    filter:
      - "tray*.png"
      - "trayTemplate*.png"
nsis:
  artifactName: Prism-Ray-Setup-${version}-${arch}.${ext}
linux:
  executableName: prism-ray
