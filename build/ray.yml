# Prism Ray product config: extends the shared base (electron-builder.yml), changing only the identity and output names.
extends: electron-builder.yml
appId: com.prism.ray
productName: Prism Ray
extraMetadata:
  # deb package name comes from package.json name; a separate name so the products can be installed side by side.
  name: prism-ray
  version: 2.0.0
artifactName: Prism-Ray-${version}-${os}-${arch}.${ext}
icon: resources/ray/icon.png
# Arrays merge with the base; that is why extraResources is only here (not in the base). Tray files come from the product folder.
extraResources:
  - from: knowledge
    to: knowledge
  - from: resources/ray
    to: .
    filter:
      - "tray*.png"
      - "trayTemplate*.png"
nsis:
  artifactName: Prism-Ray-Setup-${version}-${arch}.${ext}
linux:
  executableName: prism-ray
