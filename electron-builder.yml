# Ortak taban: ürünler build/<ürün>.yml ile derlenir (build/ray.yml, build/spectrum.yml); bu dosya yalnızca paylaşılan ayarları tutar.
appId: com.prompter.app
productName: Prism
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: knowledge
    to: knowledge
  - from: resources
    to: .
    filter:
      - "tray*.png"
      - "trayTemplate*.png"
icon: resources/icon.png
# Sürümler GitHub Actions'ta derlenip release'e iş akışı tarafından yüklenir.
publish: null

# Kurulu uygulamada kod çalıştırmaya açılan kapılar kapatılır (ELECTRON_RUN_AS_NODE, NODE_OPTIONS, --inspect)
# ve uygulama yalnızca bütünlüğü doğrulanmış app.asar'dan yüklenir.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Apple geliştirici sertifikası yok: ad-hoc imza. Apple Silicon'da "hasarlı" uyarısını önler,
  # notarize edilmediği için ilk açılışta Gatekeeper onayı gerekir (README).
  identity: "-"
  hardenedRuntime: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  executableName: prism
  synopsis: Prompt optimizer for Claude, GPT, Gemini and Grok
  maintainer: ugurshelby <222421934+ugurshelby@users.noreply.github.com>
