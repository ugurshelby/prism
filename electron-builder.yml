# Shared base: products build with build/<product>.yml (build/ray.yml, build/spectrum.yml); this file holds shared settings only.
# The identity is invalid on purpose: packaging the base directly (without --config) must not overwrite a 2.x install.
appId: invalid.base-config.use-build-product-yml
productName: Prism-base-do-not-ship
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
# extraResources lives only in build/<product>.yml: electron-builder merges arrays, so a copy here would be duplicated.
icon: resources/icon.png
# Releases are built in GitHub Actions and uploaded to the release by the workflow.
publish: null

# Close the ways to run code inside the installed app (ELECTRON_RUN_AS_NODE, NODE_OPTIONS, --inspect)
# and load the app only from an integrity-checked app.asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  # Uninstaller: removes the login entry and, optionally (default no), the user data.
  include: build/installer.nsh
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # No Apple developer certificate: ad-hoc signature. It avoids the "damaged" warning on Apple Silicon;
  # the app is not notarized, so Gatekeeper asks for approval on first launch (README).
  identity: "-"
  hardenedRuntime: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  executableName: prism
  synopsis: Prompt optimizer for Claude, GPT, Gemini and Grok
  maintainer: ugurshelby <222421934+ugurshelby@users.noreply.github.com>
