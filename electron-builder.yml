# Prism Ray, Spectrum'dan ayrı bir uygulama olarak kurulur: kendi appId'si ve kendi ayar klasörü var.
appId: com.prism.ray
productName: Prism Ray
artifactName: Prism-Ray-${version}-${os}-${arch}.${ext}
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: knowledge
    to: knowledge
  - from: resources
    to: .
    filter:
      - "tray*.png"
      - "trayTemplate*.png"
icon: resources/icon.png
publish: null

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Prism-Ray-Setup-${version}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  identity: "-"
  hardenedRuntime: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  executableName: prism-ray
  synopsis: Prism Ray, prompt optimizer for Claude
  maintainer: ugurshelby <222421934+ugurshelby@users.noreply.github.com>
